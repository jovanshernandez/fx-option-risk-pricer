[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-option-risk-pricer"
version = "0.2.0"
description = "Garman-Kohlhagen FX option pricing, Greeks, pair-level risk and spot/vol scenario grids."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
fx-risk-pricer = "fx_option_risk_pricer.cli:main"

[tool.setuptools.packages.find]
include = ["fx_option_risk_pricer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
