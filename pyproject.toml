[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-option-risk-pricer"
version = "0.1.0"
description = "CLI tool for FX option pricing and risk reports using the Garman-Kohlhagen model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
fx-risk-pricer = "fx_option_risk_pricer.cli:main"

[tool.setuptools.packages.find]
include = ["fx_option_risk_pricer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
